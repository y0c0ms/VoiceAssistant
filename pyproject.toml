[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceassistant"
version = "0.1.0"
description = "A screen-aware voice assistant for Linux with an animated pixel-art octopus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "pygame>=2.5",
    "websockets>=12",
    "PyYAML>=6",
    "langid>=1.1.6",
]

[project.optional-dependencies]
formulas = ["matplotlib>=3.8"]

[project.scripts]
voiceassistant = "voiceassistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiceassistant = ["config.example.yaml"]
